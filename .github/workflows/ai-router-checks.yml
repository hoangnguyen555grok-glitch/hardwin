name: Geed Hardwin cloud AI and account checks

on:
  push:
    branches: [main, goal8-cloud-ai-cleanup, goal9-account-menu]
    paths:
      - "api/ai/**"
      - "api/materials/**"
      - "api/community-assets/**"
      - "lib/notion-materials.js"
      - "lib/material-library.js"
      - "materials.html"
      - "docs/NOTION-MATERIAL-LIBRARY.md"
      - "lib/ai-router.js"
      - "lib/ai-agent.js"
      - "lib/supabase-*.js"
      - "index.html"
      - "library.html"
      - "lib/community-library.js"
      - "assets/community-library.json"
      - "docs/COMMUNITY-ASSET-LIBRARY.md"
      - "supabase/migrations/**"
      - "tests/*.test.js"
      - "docs/GOAL8-*.md"
      - ".github/workflows/ai-router-checks.yml"
  pull_request:
    paths:
      - "api/ai/**"
      - "api/materials/**"
      - "api/community-assets/**"
      - "lib/notion-materials.js"
      - "lib/material-library.js"
      - "materials.html"
      - "docs/NOTION-MATERIAL-LIBRARY.md"
      - "lib/ai-router.js"
      - "lib/supabase-*.js"
      - "index.html"
      - "library.html"
      - "lib/community-library.js"
      - "assets/community-library.json"
      - "docs/COMMUNITY-ASSET-LIBRARY.md"
      - "supabase/migrations/**"
      - "tests/*.test.js"
      - "docs/GOAL8-*.md"
      - ".github/workflows/ai-router-checks.yml"

permissions:
  contents: read

jobs:
  cloud-ai-account-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run account, AI and community integration tests
        run: node --test tests/*.test.js
      - name: Syntax-check server and browser modules
        run: |
          node --check api/ai/chat.js
          node --check api/materials/index.js
          node --check api/community-assets/index.js
          node --check lib/notion-materials.js
          node --input-type=module --check < lib/material-library.js
          node --check lib/ai-router.js
          node --check lib/ai-agent.js
          node --check lib/gif-export.mjs
          node --check lib/supabase-ai-gateway.js
          node --input-type=module --check < lib/supabase-auth.js
          node --check lib/community-library.js
          node --input-type=module --check < workers/runway-transfer/src/index.mjs
