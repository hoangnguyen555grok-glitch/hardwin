name: TTS.ai anonymous Vietnamese Piper smoke test
on:
  push:
    branches: [feat/ttsai-piper-provider]
    paths:
      - "tests/ttsai-live-smoke.mjs"
      - ".github/workflows/ttsai-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify anonymous Vietnamese Piper API and MP3 output
        run: node tests/ttsai-live-smoke.mjs
